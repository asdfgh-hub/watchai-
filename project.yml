name: WristAI
options:
  bundleIdPrefix: com.wristai
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  WristAI:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    dependencies:
      - target: WristAIWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wristai.app
        PRODUCT_NAME: WristAI
        INFOPLIST_KEY_CFBundleDisplayName: WristAI
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: WristAI использует последние фотографии для отправки их в Claude по вашему запросу.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: WristAI не сохраняет фотографии в медиатеку.
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  WristAIWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wristai.app.watchkitapp
        PRODUCT_NAME: WristAIWatch
        INFOPLIST_KEY_CFBundleDisplayName: WristAI
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.wristai.app
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_EMIT_LOC_STRINGS: YES
